# BookShare 2.0: backend (Spring Boot) + PostgreSQL + frontend (React served by nginx)
# Start everything with:  docker compose up --build      then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookshare
      POSTGRES_USER: bookshare
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bookshare}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookshare -d bookshare"]
      interval: 5s
      timeout: 5s
      retries: 12

  
  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/bookshare
      DB_USER: bookshare
      DB_PASSWORD: ${DB_PASSWORD:-bookshare}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-long-random-secret-of-at-least-32-bytes}
      UPLOAD_DIR: /data/uploads
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@bookshare.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      SEED_DEMO: ${SEED_DEMO:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"


  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
  uploads:
